<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TechParts Admin · Inventario de componentes de PC</title>
<style>
  :root {
    --bg: #0a0f1e;
    --bg-2: #0e1528;
    --panel: #121a30;
    --panel-2: #172039;
    --border: #222d4a;
    --text: #e7ecf7;
    --muted: #8f9bb8;
    --accent: #6d7cff;
    --accent-2: #22d3ee;
    --ok: #34d399;
    --warn: #fbbf24;
    --danger: #f87171;
    --radius: 14px;
    --shadow: 0 10px 30px rgba(0, 0, 0, .35);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    font-family: "Segoe UI", system-ui, -apple-system, Roboto, "Helvetica Neue", Arial, sans-serif;
    background:
      radial-gradient(1000px 500px at 85% -10%, rgba(109,124,255,.18), transparent 60%),
      radial-gradient(800px 400px at -10% 10%, rgba(34,211,238,.10), transparent 55%),
      var(--bg);
    color: var(--text);
    min-height: 100vh;
    -webkit-font-smoothing: antialiased;
  }
  .wrap { max-width: 1240px; margin: 0 auto; padding: 24px 20px 60px; }

  /* ---------- Topbar ---------- */
  .topbar { display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap; margin-bottom: 26px; }
  .brand { display: flex; align-items: center; gap: 14px; }
  .logo {
    width: 46px; height: 46px; border-radius: 13px; display: grid; place-items: center;
    font-weight: 800; letter-spacing: .5px; color: #fff;
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    box-shadow: 0 8px 22px rgba(109,124,255,.45);
  }
  .brand h1 { font-size: 20px; margin: 0; letter-spacing: .2px; }
  .brand p { margin: 2px 0 0; font-size: 13px; color: var(--muted); }
  .top-actions { display: flex; align-items: center; gap: 12px; }
  .api-status {
    display: inline-flex; align-items: center; gap: 8px; font-size: 12.5px; color: var(--muted);
    padding: 8px 12px; border: 1px solid var(--border); border-radius: 999px; background: var(--panel);
  }
  .api-status i { width: 8px; height: 8px; border-radius: 50%; background: var(--warn); box-shadow: 0 0 0 4px rgba(251,191,36,.15); }
  .api-status.ok i { background: var(--ok); box-shadow: 0 0 0 4px rgba(52,211,153,.15); }
  .api-status.fail i { background: var(--danger); box-shadow: 0 0 0 4px rgba(248,113,113,.15); }

  /* ---------- Buttons ---------- */
  .btn {
    font: inherit; font-size: 14px; font-weight: 600; cursor: pointer; border-radius: 10px;
    padding: 10px 16px; border: 1px solid var(--border); background: var(--panel-2); color: var(--text);
    transition: transform .12s ease, background .15s ease, border-color .15s ease, opacity .15s ease;
  }
  .btn:hover { background: #1d2848; border-color: #2e3c64; }
  .btn:active { transform: translateY(1px); }
  .btn:disabled { opacity: .55; cursor: not-allowed; }
  .btn.primary { background: linear-gradient(135deg, var(--accent), #5563f0); border-color: transparent; color: #fff; box-shadow: 0 8px 20px rgba(109,124,255,.35); }
  .btn.primary:hover { filter: brightness(1.08); }
  .btn.danger { background: rgba(248,113,113,.14); border-color: rgba(248,113,113,.4); color: #fecaca; }
  .btn.danger:hover { background: rgba(248,113,113,.24); }
  .icon-btn {
    width: 34px; height: 34px; display: inline-grid; place-items: center; border-radius: 9px; cursor: pointer;
    background: transparent; border: 1px solid var(--border); color: var(--muted); transition: all .15s ease;
  }
  .icon-btn:hover { color: var(--text); background: var(--panel-2); border-color: #34416a; }
  .icon-btn.del:hover { color: var(--danger); border-color: rgba(248,113,113,.5); background: rgba(248,113,113,.1); }
  .icon-btn svg { width: 16px; height: 16px; }

  /* ---------- Stats ---------- */
  .stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; margin-bottom: 22px; }
  .stat {
    background: linear-gradient(180deg, var(--panel), var(--bg-2)); border: 1px solid var(--border);
    border-radius: var(--radius); padding: 18px 18px 16px; position: relative; overflow: hidden; box-shadow: var(--shadow);
  }
  .stat::after { content: ""; position: absolute; right: -30px; top: -30px; width: 110px; height: 110px; border-radius: 50%; background: var(--glow, rgba(109,124,255,.12)); filter: blur(6px); }
  .stat .label { font-size: 12.5px; color: var(--muted); text-transform: uppercase; letter-spacing: .8px; font-weight: 600; }
  .stat .value { font-size: 28px; font-weight: 750; margin-top: 8px; letter-spacing: -.5px; }
  .stat .hint { font-size: 12.5px; color: var(--muted); margin-top: 4px; }

  /* ---------- Panel / toolbar ---------- */
  .panel { background: var(--panel); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: var(--shadow); overflow: hidden; }
  .toolbar { display: flex; gap: 12px; flex-wrap: wrap; padding: 16px; border-bottom: 1px solid var(--border); background: rgba(255,255,255,.015); }
  .search { flex: 1 1 260px; position: relative; }
  .search svg { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); width: 17px; height: 17px; color: var(--muted); pointer-events: none; }
  .field, select.field {
    font: inherit; font-size: 14px; color: var(--text); background: var(--bg-2); border: 1px solid var(--border);
    border-radius: 10px; padding: 10px 12px; width: 100%; outline: none; transition: border-color .15s, box-shadow .15s;
  }
  .search .field { padding-left: 38px; }
  .field:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(109,124,255,.22); }
  .field.invalid { border-color: var(--danger); box-shadow: 0 0 0 3px rgba(248,113,113,.15); }
  .toolbar select.field { width: auto; min-width: 190px; }
  option { background: #101830; color: var(--text); }

  /* ---------- Table ---------- */
  .table-scroll { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; min-width: 860px; }
  thead th {
    text-align: left; font-size: 12px; text-transform: uppercase; letter-spacing: .8px; color: var(--muted);
    font-weight: 600; padding: 13px 16px; border-bottom: 1px solid var(--border); white-space: nowrap;
  }
  tbody td { padding: 14px 16px; border-bottom: 1px solid rgba(34,45,74,.7); vertical-align: middle; font-size: 14px; }
  tbody tr { transition: background .12s ease; }
  tbody tr:hover { background: rgba(109,124,255,.06); }
  tbody tr:last-child td { border-bottom: none; }
  .prod-name { font-weight: 650; }
  .prod-meta { font-size: 12.5px; color: var(--muted); margin-top: 3px; max-width: 420px; }
  .sku { font-family: ui-monospace, "Cascadia Mono", Consolas, monospace; font-size: 11.5px; color: var(--accent-2); background: rgba(34,211,238,.08); padding: 2px 7px; border-radius: 6px; margin-left: 8px; vertical-align: middle; }
  .badge {
    display: inline-block; padding: 4px 10px; border-radius: 999px; font-size: 12px; font-weight: 650; white-space: nowrap;
    background: hsl(var(--h) 70% 55% / .14); color: hsl(var(--h) 90% 76%); border: 1px solid hsl(var(--h) 70% 55% / .3);
  }
  .price { font-weight: 700; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .pill { display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px; border-radius: 999px; font-size: 12px; font-weight: 700; white-space: nowrap; }
  .pill::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
  .pill.ok { color: var(--ok); background: rgba(52,211,153,.12); }
  .pill.low { color: var(--warn); background: rgba(251,191,36,.12); }
  .pill.out { color: var(--danger); background: rgba(248,113,113,.12); }
  .actions { display: flex; gap: 8px; justify-content: flex-end; }
  th.right, td.right { text-align: right; }

  .empty { text-align: center; padding: 60px 20px; color: var(--muted); }
  .empty b { display: block; color: var(--text); font-size: 16px; margin-bottom: 6px; }
  .skeleton td { padding: 18px 16px; }
  .skeleton span { display: block; height: 14px; border-radius: 6px; background: linear-gradient(90deg, #17213a 25%, #202c4d 37%, #17213a 63%); background-size: 400% 100%; animation: shimmer 1.3s infinite; }
  @keyframes shimmer { 0% { background-position: 100% 0; } 100% { background-position: 0 0; } }

  .pager { display: flex; justify-content: space-between; align-items: center; padding: 14px 16px; border-top: 1px solid var(--border); gap: 12px; flex-wrap: wrap; }
  .pager .info { font-size: 13px; color: var(--muted); }
  .pager .ctrls { display: flex; gap: 8px; align-items: center; }
  .pager .page { font-size: 13px; color: var(--muted); min-width: 90px; text-align: center; }

  /* ---------- Modal ---------- */
  .overlay { position: fixed; inset: 0; background: rgba(4,7,16,.72); backdrop-filter: blur(4px); display: none; align-items: center; justify-content: center; padding: 20px; z-index: 50; }
  .overlay.open { display: flex; animation: fade .15s ease; }
  @keyframes fade { from { opacity: 0; } to { opacity: 1; } }
  .modal { width: 100%; max-width: 620px; max-height: 92vh; overflow: auto; background: var(--panel); border: 1px solid var(--border); border-radius: 18px; box-shadow: 0 30px 80px rgba(0,0,0,.6); animation: pop .18s ease; }
  .modal.sm { max-width: 430px; }
  @keyframes pop { from { transform: translateY(10px) scale(.98); opacity: 0; } to { transform: none; opacity: 1; } }
  .modal-head { display: flex; justify-content: space-between; align-items: center; padding: 18px 22px; border-bottom: 1px solid var(--border); }
  .modal-head h2 { margin: 0; font-size: 17px; }
  .modal-body { padding: 20px 22px; }
  .modal-foot { display: flex; justify-content: flex-end; gap: 10px; padding: 16px 22px; border-top: 1px solid var(--border); background: rgba(255,255,255,.015); }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  .grid2 .full { grid-column: 1 / -1; }
  label { display: block; font-size: 12.5px; font-weight: 600; color: var(--muted); margin-bottom: 6px; }
  .err { color: var(--danger); font-size: 12px; margin-top: 5px; min-height: 0; }
  .banner { display: none; margin-bottom: 14px; padding: 10px 12px; border-radius: 10px; font-size: 13px; background: rgba(248,113,113,.12); border: 1px solid rgba(248,113,113,.4); color: #fecaca; }
  .banner.show { display: block; }
  .confirm-text { color: var(--muted); line-height: 1.55; font-size: 14.5px; margin: 0; }
  .confirm-text b { color: var(--text); }

  /* ---------- Toasts ---------- */
  .toasts { position: fixed; right: 18px; bottom: 18px; display: flex; flex-direction: column; gap: 10px; z-index: 100; }
  .toast { min-width: 260px; max-width: 360px; padding: 13px 16px; border-radius: 12px; font-size: 14px; background: var(--panel-2); border: 1px solid var(--border); border-left: 4px solid var(--accent); box-shadow: var(--shadow); animation: slide .25s ease; }
  .toast.ok { border-left-color: var(--ok); }
  .toast.error { border-left-color: var(--danger); }
  @keyframes slide { from { transform: translateX(30px); opacity: 0; } to { transform: none; opacity: 1; } }

  footer { text-align: center; color: var(--muted); font-size: 12.5px; margin-top: 26px; }

  @media (max-width: 900px) { .stats { grid-template-columns: repeat(2, 1fr); } }
  @media (max-width: 560px) {
    .stats { grid-template-columns: 1fr 1fr; gap: 10px; }
    .stat .value { font-size: 22px; }
    .grid2 { grid-template-columns: 1fr; }
    .toolbar select.field { width: 100%; }
    .top-actions { width: 100%; justify-content: space-between; }
  }
</style>
</head>
<body>
<div class="wrap">

  <header class="topbar">
    <div class="brand">
      <div class="logo">TP</div>
      <div>
        <h1>TechParts Admin</h1>
        <p>Panel de inventario · Componentes de PC y hardware</p>
      </div>
    </div>
    <div class="top-actions">
      <span class="api-status" id="apiStatus"><i></i><span>Conectando…</span></span>
      <button class="btn primary" id="btnNuevo">+ Nuevo producto</button>
    </div>
  </header>

  <section class="stats" id="stats"></section>

  <section class="panel">
    <div class="toolbar">
      <div class="search">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input class="field" id="buscar" type="search" placeholder="Buscar por nombre, marca o SKU…" autocomplete="off">
      </div>
      <select class="field" id="filtroCategoria" aria-label="Filtrar por categoría"></select>
      <select class="field" id="orden" aria-label="Ordenar">
        <option value="categoria">Ordenar: Categoría</option>
        <option value="nombre">Nombre (A-Z)</option>
        <option value="precio_asc">Precio: menor a mayor</option>
        <option value="precio_desc">Precio: mayor a menor</option>
        <option value="stock_asc">Stock: menor a mayor</option>
        <option value="stock_desc">Stock: mayor a menor</option>
      </select>
    </div>

    <div class="table-scroll">
      <table>
        <thead>
          <tr>
            <th>Producto</th>
            <th>Categoría</th>
            <th>Marca</th>
            <th class="right">Precio</th>
            <th>Stock</th>
            <th class="right">Acciones</th>
          </tr>
        </thead>
        <tbody id="tbody"></tbody>
      </table>
    </div>

    <div class="pager">
      <div class="info" id="pagerInfo"></div>
      <div class="ctrls">
        <button class="btn" id="prev">← Anterior</button>
        <span class="page" id="pageLabel"></span>
        <button class="btn" id="next">Siguiente →</button>
      </div>
    </div>
  </section>

  <footer>API REST · Node.js + Express + MySQL (mysql2/promise) · Guía Práctica Semana 10</footer>
</div>

<!-- Modal crear / editar -->
<div class="overlay" id="modalForm" aria-hidden="true">
  <form class="modal" id="form" novalidate>
    <div class="modal-head">
      <h2 id="modalTitulo">Nuevo producto</h2>
      <button type="button" class="icon-btn" data-close aria-label="Cerrar">✕</button>
    </div>
    <div class="modal-body">
      <div class="banner" id="formBanner"></div>
      <div class="grid2">
        <div>
          <label for="fSku">SKU *</label>
          <input class="field" id="fSku" maxlength="30" placeholder="Ej: CPU-AMD-7600">
          <div class="err" data-err="sku"></div>
        </div>
        <div>
          <label for="fCategoria">Categoría *</label>
          <select class="field" id="fCategoria"></select>
          <div class="err" data-err="categoria"></div>
        </div>
        <div class="full">
          <label for="fNombre">Nombre del producto *</label>
          <input class="field" id="fNombre" maxlength="150" placeholder="Ej: Ryzen 5 7600">
          <div class="err" data-err="nombre"></div>
        </div>
        <div>
          <label for="fMarca">Marca *</label>
          <input class="field" id="fMarca" maxlength="80" placeholder="Ej: AMD">
          <div class="err" data-err="marca"></div>
        </div>
        <div class="grid2" style="grid-column: auto; gap: 14px;">
          <div>
            <label for="fPrecio">Precio (S/) *</label>
            <input class="field" id="fPrecio" type="number" min="0" step="0.01" placeholder="0.00">
            <div class="err" data-err="precio"></div>
          </div>
          <div>
            <label for="fStock">Stock *</label>
            <input class="field" id="fStock" type="number" min="0" step="1" placeholder="0">
            <div class="err" data-err="stock"></div>
          </div>
        </div>
        <div class="full">
          <label for="fEsp">Especificaciones técnicas</label>
          <input class="field" id="fEsp" maxlength="255" placeholder="Ej: Socket AM5 · 6 núcleos / 12 hilos">
        </div>
      </div>
    </div>
    <div class="modal-foot">
      <button type="button" class="btn" data-close>Cancelar</button>
      <button type="submit" class="btn primary" id="btnGuardar">Guardar</button>
    </div>
  </form>
</div>

<!-- Modal eliminar -->
<div class="overlay" id="modalDel" aria-hidden="true">
  <div class="modal sm">
    <div class="modal-head">
      <h2>Eliminar producto</h2>
      <button type="button" class="icon-btn" data-close aria-label="Cerrar">✕</button>
    </div>
    <div class="modal-body">
      <p class="confirm-text" id="delTexto"></p>
    </div>
    <div class="modal-foot">
      <button type="button" class="btn" data-close>Cancelar</button>
      <button type="button" class="btn danger" id="btnConfirmDel">Sí, eliminar</button>
    </div>
  </div>
</div>

<div class="toasts" id="toasts"></div>

<script>
  const API = '/api/productos';
  const CATEGORIAS = ['Procesadores', 'Tarjetas Gráficas', 'Placas Madre', 'Memoria RAM', 'Almacenamiento', 'Fuentes de Poder', 'Refrigeración', 'Gabinetes'];
  const HUES = [215, 280, 165, 32, 190, 335, 120, 52];
  const PAGE_SIZE = 8;
  const STOCK_BAJO = 5;

  const state = { todos: [], pagina: 1, editId: null, delId: null, cargando: true };
  const $ = (s) => document.querySelector(s);
  const money = new Intl.NumberFormat('es-PE', { style: 'currency', currency: 'PEN' });
  const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

  const ICON_EDIT = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>';
  const ICON_DEL = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"/><path d="M8 6V4h8v2"/><path d="m19 6-1 14H6L5 6"/><path d="M10 11v6M14 11v6"/></svg>';

  /* ---------- Cliente HTTP ---------- */
  async function api(url, options = {}) {
    const res = await fetch(url, { headers: { 'Content-Type': 'application/json' }, ...options });
    let data = null;
    try { data = await res.json(); } catch (_) { /* sin cuerpo */ }
    if (!res.ok) throw new Error((data && data.error) || `Error ${res.status}`);
    return data;
  }

  function toast(msg, tipo = 'ok') {
    const el = document.createElement('div');
    el.className = `toast ${tipo}`;
    el.textContent = msg;
    $('#toasts').appendChild(el);
    setTimeout(() => el.remove(), 3800);
  }

  function setStatus(ok) {
    const el = $('#apiStatus');
    el.className = 'api-status ' + (ok ? 'ok' : 'fail');
    el.lastElementChild.textContent = ok ? 'API conectada' : 'API sin conexión';
  }

  /* ---------- Datos ---------- */
  async function cargar() {
    state.cargando = true;
    render();
    try {
      state.todos = await api(API);
      setStatus(true);
    } catch (e) {
      state.todos = [];
      setStatus(false);
      toast('No se pudo cargar el inventario: ' + e.message, 'error');
    }
    state.cargando = false;
    render();
  }

  function hueDe(cat) {
    const i = CATEGORIAS.indexOf(cat);
    if (i >= 0) return HUES[i];
    let h = 0;
    for (const c of String(cat)) h = (h * 31 + c.charCodeAt(0)) % 360;
    return h;
  }

  function filtrados() {
    const q = $('#buscar').value.trim().toLowerCase();
    const cat = $('#filtroCategoria').value;
    let lista = state.todos.filter((p) => {
      const okCat = !cat || p.categoria === cat;
      const okQ = !q || [p.nombre, p.marca, p.sku, p.especificaciones].some((v) => String(v ?? '').toLowerCase().includes(q));
      return okCat && okQ;
    });
    const orden = $('#orden').value;
    const cmp = {
      categoria: (a, b) => a.categoria.localeCompare(b.categoria) || a.nombre.localeCompare(b.nombre),
      nombre: (a, b) => a.nombre.localeCompare(b.nombre),
      precio_asc: (a, b) => a.precio - b.precio,
      precio_desc: (a, b) => b.precio - a.precio,
      stock_asc: (a, b) => a.stock - b.stock,
      stock_desc: (a, b) => b.stock - a.stock,
    }[orden];
    return lista.sort(cmp);
  }

  /* ---------- Render ---------- */
  function renderStats() {
    const t = state.todos;
    const valor = t.reduce((s, p) => s + p.precio * p.stock, 0);
    const bajo = t.filter((p) => p.stock > 0 && p.stock <= STOCK_BAJO).length;
    const agot = t.filter((p) => p.stock === 0).length;
    const cats = new Set(t.map((p) => p.categoria)).size;
    const cards = [
      { label: 'Productos activos', value: t.length, hint: `en ${cats} categorías`, glow: 'rgba(109,124,255,.16)' },
      { label: 'Valor del inventario', value: money.format(valor), hint: 'precio × stock', glow: 'rgba(34,211,238,.14)' },
      { label: 'Stock bajo', value: bajo, hint: `${STOCK_BAJO} unidades o menos`, glow: 'rgba(251,191,36,.16)' },
      { label: 'Agotados', value: agot, hint: 'requieren reposición', glow: 'rgba(248,113,113,.16)' },
    ];
    $('#stats').innerHTML = cards.map((c) => `
      <div class="stat" style="--glow:${c.glow}">
        <div class="label">${c.label}</div>
        <div class="value">${c.value}</div>
        <div class="hint">${c.hint}</div>
      </div>`).join('');
  }

  function renderFiltroCategorias() {
    const sel = $('#filtroCategoria');
    const actual = sel.value;
    const cats = [...new Set([...CATEGORIAS, ...state.todos.map((p) => p.categoria)])];
    sel.innerHTML = '<option value="">Todas las categorías</option>' +
      cats.map((c) => `<option value="${esc(c)}">${esc(c)}</option>`).join('');
    sel.value = cats.includes(actual) ? actual : '';
  }

  function stockPill(n) {
    if (n === 0) return '<span class="pill out">Agotado</span>';
    if (n <= STOCK_BAJO) return `<span class="pill low">Bajo · ${n}</span>`;
    return `<span class="pill ok">${n} en stock</span>`;
  }

  function render() {
    renderStats();
    renderFiltroCategorias();
    const tbody = $('#tbody');

    if (state.cargando) {
      tbody.innerHTML = Array.from({ length: 5 }, () =>
        '<tr class="skeleton">' + '<td><span></span></td>'.repeat(6) + '</tr>').join('');
      $('#pagerInfo').textContent = 'Cargando inventario…';
      $('#pageLabel').textContent = '';
      $('#prev').disabled = $('#next').disabled = true;
      return;
    }

    const lista = filtrados();
    const paginas = Math.max(1, Math.ceil(lista.length / PAGE_SIZE));
    state.pagina = Math.min(Math.max(1, state.pagina), paginas);
    const ini = (state.pagina - 1) * PAGE_SIZE;
    const vista = lista.slice(ini, ini + PAGE_SIZE);

    if (vista.length === 0) {
      tbody.innerHTML = `<tr><td colspan="6"><div class="empty"><b>No se encontraron productos</b>Prueba con otra búsqueda o categoría.</div></td></tr>`;
    } else {
      tbody.innerHTML = vista.map((p) => `
        <tr>
          <td>
            <div><span class="prod-name">${esc(p.nombre)}</span><span class="sku">${esc(p.sku)}</span></div>
            <div class="prod-meta">${esc(p.especificaciones || 'Sin especificaciones')}</div>
          </td>
          <td><span class="badge" style="--h:${hueDe(p.categoria)}">${esc(p.categoria)}</span></td>
          <td>${esc(p.marca)}</td>
          <td class="right price">${money.format(p.precio)}</td>
          <td>${stockPill(p.stock)}</td>
          <td>
            <div class="actions">
              <button class="icon-btn" data-edit="${p.id}" title="Editar" aria-label="Editar ${esc(p.nombre)}">${ICON_EDIT}</button>
              <button class="icon-btn del" data-del="${p.id}" title="Eliminar" aria-label="Eliminar ${esc(p.nombre)}">${ICON_DEL}</button>
            </div>
          </td>
        </tr>`).join('');
    }

    const desde = lista.length ? ini + 1 : 0;
    const hasta = Math.min(ini + PAGE_SIZE, lista.length);
    $('#pagerInfo').textContent = `Mostrando ${desde}–${hasta} de ${lista.length} productos`;
    $('#pageLabel').textContent = `Página ${state.pagina} de ${paginas}`;
    $('#prev').disabled = state.pagina <= 1;
    $('#next').disabled = state.pagina >= paginas;
  }

  /* ---------- Modales ---------- */
  const openModal = (id) => { const m = $(id); m.classList.add('open'); m.setAttribute('aria-hidden', 'false'); };
  const closeModals = () => document.querySelectorAll('.overlay').forEach((m) => { m.classList.remove('open'); m.setAttribute('aria-hidden', 'true'); });

  function limpiarErrores() {
    document.querySelectorAll('[data-err]').forEach((e) => (e.textContent = ''));
    document.querySelectorAll('#form .field').forEach((f) => f.classList.remove('invalid'));
    $('#formBanner').classList.remove('show');
  }

  function llenarCategoriasForm(actual) {
    const cats = [...CATEGORIAS];
    if (actual && !cats.includes(actual)) cats.push(actual);
    $('#fCategoria').innerHTML = cats.map((c) => `<option value="${esc(c)}">${esc(c)}</option>`).join('');
    $('#fCategoria').value = actual || cats[0];
  }

  function abrirForm(prod = null) {
    limpiarErrores();
    state.editId = prod ? prod.id : null;
    $('#modalTitulo').textContent = prod ? `Editar producto #${prod.id}` : 'Nuevo producto';
    $('#btnGuardar').textContent = prod ? 'Guardar cambios' : 'Crear producto';
    llenarCategoriasForm(prod ? prod.categoria : null);
    $('#fSku').value = prod ? prod.sku : '';
    $('#fNombre').value = prod ? prod.nombre : '';
    $('#fMarca').value = prod ? prod.marca : '';
    $('#fPrecio').value = prod ? prod.precio : '';
    $('#fStock').value = prod ? prod.stock : '';
    $('#fEsp').value = prod ? (prod.especificaciones || '') : '';
    openModal('#modalForm');
    setTimeout(() => $('#fSku').focus(), 50);
  }

  function validarForm() {
    limpiarErrores();
    const errores = {};
    const v = {
      sku: $('#fSku').value.trim(),
      nombre: $('#fNombre').value.trim(),
      categoria: $('#fCategoria').value,
      marca: $('#fMarca').value.trim(),
      precio: $('#fPrecio').value,
      stock: $('#fStock').value,
      especificaciones: $('#fEsp').value.trim(),
    };
    if (!v.sku) errores.sku = 'El SKU es obligatorio';
    if (!v.nombre) errores.nombre = 'El nombre es obligatorio';
    if (!v.categoria) errores.categoria = 'Selecciona una categoría';
    if (!v.marca) errores.marca = 'La marca es obligatoria';
    if (v.precio === '' || !Number.isFinite(Number(v.precio)) || Number(v.precio) < 0) errores.precio = 'Ingresa un precio válido (≥ 0)';
    if (v.stock === '' || !Number.isInteger(Number(v.stock)) || Number(v.stock) < 0) errores.stock = 'Ingresa un stock entero (≥ 0)';

    const campos = { sku: '#fSku', nombre: '#fNombre', categoria: '#fCategoria', marca: '#fMarca', precio: '#fPrecio', stock: '#fStock' };
    for (const [k, msg] of Object.entries(errores)) {
      document.querySelector(`[data-err="${k}"]`).textContent = msg;
      $(campos[k]).classList.add('invalid');
    }
    if (Object.keys(errores).length) return null;
    return { ...v, precio: Number(v.precio), stock: Number(v.stock), especificaciones: v.especificaciones || null };
  }

  async function guardar(e) {
    e.preventDefault();
    const payload = validarForm();
    if (!payload) return;
    const btn = $('#btnGuardar');
    btn.disabled = true;
    try {
      if (state.editId) {
        await api(`${API}/${state.editId}`, { method: 'PUT', body: JSON.stringify(payload) });
        toast('Producto actualizado correctamente');
      } else {
        await api(API, { method: 'POST', body: JSON.stringify(payload) });
        toast('Producto creado correctamente');
      }
      closeModals();
      await cargar();
    } catch (err) {
      const b = $('#formBanner');
      b.textContent = err.message;
      b.classList.add('show');
      if (/sku/i.test(err.message)) $('#fSku').classList.add('invalid');
    } finally {
      btn.disabled = false;
    }
  }

  function pedirEliminar(id) {
    const p = state.todos.find((x) => x.id === id);
    if (!p) return;
    state.delId = id;
    $('#delTexto').innerHTML = `¿Seguro que deseas eliminar <b>${esc(p.nombre)}</b> (${esc(p.sku)})? Dejará de aparecer en el inventario.`;
    openModal('#modalDel');
  }

  async function confirmarEliminar() {
    const btn = $('#btnConfirmDel');
    btn.disabled = true;
    try {
      await api(`${API}/${state.delId}`, { method: 'DELETE' });
      toast('Producto eliminado');
      closeModals();
      await cargar();
    } catch (err) {
      toast(err.message, 'error');
    } finally {
      btn.disabled = false;
    }
  }

  /* ---------- Eventos ---------- */
  $('#btnNuevo').addEventListener('click', () => abrirForm());
  $('#form').addEventListener('submit', guardar);
  $('#btnConfirmDel').addEventListener('click', confirmarEliminar);
  document.querySelectorAll('[data-close]').forEach((b) => b.addEventListener('click', closeModals));
  document.querySelectorAll('.overlay').forEach((o) => o.addEventListener('mousedown', (e) => { if (e.target === o) closeModals(); }));
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeModals(); });

  ['#buscar', '#filtroCategoria', '#orden'].forEach((s) => {
    $(s).addEventListener('input', () => { state.pagina = 1; render(); });
  });
  $('#prev').addEventListener('click', () => { state.pagina--; render(); });
  $('#next').addEventListener('click', () => { state.pagina++; render(); });

  $('#tbody').addEventListener('click', (e) => {
    const edit = e.target.closest('[data-edit]');
    const del = e.target.closest('[data-del]');
    if (edit) abrirForm(state.todos.find((p) => p.id === Number(edit.dataset.edit)));
    if (del) pedirEliminar(Number(del.dataset.del));
  });

  cargar();
</script>
</body>
</html>
